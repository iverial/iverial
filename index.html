<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Marisol 🌸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,500&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #FDF6F3;
    --card: #FBEDE6;
    --pink: #E88C8C;
    --pink-deep: #C4881A;
    --lilac: #A98FC2;
    --sage: #7E9772;
    --ink: #4A3A3E;
    --paper-shadow: rgba(150, 90, 90, 0.14);
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; height:100%; background:var(--cream); }
  body{
    font-family:'Nunito Sans', sans-serif;
    color:var(--ink);
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow-x:hidden;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    background-image:
      radial-gradient(circle at 12% 18%, rgba(232,140,140,0.10), transparent 40%),
      radial-gradient(circle at 88% 78%, rgba(169,143,194,0.10), transparent 45%);
  }
  .wrap{ width:100%; max-width:560px; padding: 8vh 28px 10vh; text-align:center; }
  .card{
    background: var(--card);
    border-radius: 22px;
    padding: 6vh 6vw 5vh;
    box-shadow: 0 18px 50px var(--paper-shadow);
    border: 1px solid rgba(169,143,194,0.18);
  }
  .eyebrow{
    font-size:0.95rem;
    color: var(--sage);
    opacity:0;
    animation: rise 0.9s ease-out 0.15s forwards;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(2.4rem, 8.5vw, 3.3rem);
    line-height:1.08;
    margin: 0.3em 0 0.1em;
    color: var(--pink-deep);
    opacity:0;
    animation: rise 0.9s ease-out 0.3s forwards;
  }
  h1 em{ font-style:italic; color: var(--lilac); }

  .bloom-holder{
    margin: 3vh auto 2vh;
    width:min(360px, 78vw);
    opacity:0;
    transform: translateY(16px) scale(0.97);
    animation: rise-bloom 1.1s cubic-bezier(.2,.8,.2,1) 0.5s forwards;
  }

  .message{
    font-size:1.08rem;
    line-height:1.7;
    max-width: 44ch;
    margin: 1.5em auto 0;
    opacity:0;
    animation: rise 0.9s ease-out 1.6s forwards;
  }
  .signoff{
    margin-top: 2.2em;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:1.15rem;
    color: var(--pink-deep);
    opacity:0;
    animation: rise 0.9s ease-out 1.9s forwards;
  }

  @keyframes rise{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  @keyframes rise-bloom{ from{opacity:0; transform:translateY(16px) scale(0.97);} to{opacity:1; transform:translateY(0) scale(1);} }

  .petal-group{
    transform-origin:center;
    animation: unfurl 0.7s cubic-bezier(.34,1.56,.64,1) backwards;
  }
  .f1 .petal-group{ animation-delay: 0.7s; }
  .f2 .petal-group{ animation-delay: 0.85s; }
  .f3 .petal-group{ animation-delay: 1.0s; }
  .f4 .petal-group{ animation-delay: 1.15s; }
  .f5 .petal-group{ animation-delay: 1.3s; }
  @keyframes unfurl{ from{opacity:0; transform:scale(0.4);} to{opacity:1; transform:scale(1);} }

  .stem-line{
    stroke-dasharray: 200;
    stroke-dashoffset: 200;
    animation: draw 1s ease-out 0.4s forwards;
  }
  @keyframes draw{ to{ stroke-dashoffset: 0; } }

  .heart{
    opacity:0;
    animation: heartbeat 1.6s ease-in-out 1.8s infinite, rise 0.9s ease-out 1.5s forwards;
  }
  @keyframes heartbeat{
    0%,100%{ transform: scale(1); }
    50%{ transform: scale(1.12); }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; animation-delay: 0s !important; }
  }

  footer{ padding: 0 24px 4vh; font-size: 0.8rem; color: var(--sage); opacity: 0.55; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="eyebrow">Aunque estemos lejos</div>
      <h1>Feliz <em>primavera</em>,<br>Marisol</h1>

      <div class="bloom-holder">
        <svg viewBox="0 0 340 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flores de primavera y un corazón">
          <!-- stems -->
          <path class="stem-line" d="M170 250 C165 215 150 195 138 155" stroke="#7E9772" stroke-width="4" fill="none" stroke-linecap="round"/>
          <path class="stem-line" d="M170 250 C172 205 178 180 182 135" stroke="#7E9772" stroke-width="4" fill="none" stroke-linecap="round"/>
          <path class="stem-line" d="M170 250 C180 220 208 200 224 165" stroke="#7E9772" stroke-width="4" fill="none" stroke-linecap="round"/>
          <path class="stem-line" d="M170 250 C158 220 128 205 108 175" stroke="#7E9772" stroke-width="4" fill="none" stroke-linecap="round"/>
          <path class="stem-line" d="M170 250 C168 218 160 195 158 165" stroke="#7E9772" stroke-width="4" fill="none" stroke-linecap="round"/>

          <!-- leaves -->
          <path d="M150 210 Q118 205 106 185 Q140 182 156 205 Z" fill="#8FA37E"/>
          <path d="M198 195 Q228 187 242 166 Q207 164 192 187 Z" fill="#8FA37E"/>
          <path d="M172 205 Q172 175 160 155 Q190 160 192 190 Z" fill="#9EB18B"/>

          <!-- yellow flower -->
          <g class="f1" transform="translate(138,155)">
            <g class="petal-group">
              <g fill="#EDBB2E">
                <ellipse cx="0" cy="-24" rx="9" ry="18"/>
                <ellipse cx="17" cy="-14" rx="9" ry="18" transform="rotate(60 17 -14)"/>
                <ellipse cx="17" cy="14" rx="9" ry="18" transform="rotate(120 17 14)"/>
                <ellipse cx="0" cy="24" rx="9" ry="18" transform="rotate(180 0 24)"/>
                <ellipse cx="-17" cy="14" rx="9" ry="18" transform="rotate(240 -17 14)"/>
                <ellipse cx="-17" cy="-14" rx="9" ry="18" transform="rotate(300 -17 -14)"/>
              </g>
              <circle r="11" fill="#96641F"/>
            </g>
          </g>

          <!-- yellow flower (large, center) -->
          <g class="f4" transform="translate(182,135)">
            <g class="petal-group">
              <g fill="#E3A91B">
                <ellipse cx="0" cy="-26" rx="10" ry="20"/>
                <ellipse cx="18" cy="-16" rx="10" ry="20" transform="rotate(60 18 -16)"/>
                <ellipse cx="18" cy="16" rx="10" ry="20" transform="rotate(120 18 16)"/>
                <ellipse cx="0" cy="26" rx="10" ry="20" transform="rotate(180 0 26)"/>
                <ellipse cx="-18" cy="16" rx="10" ry="20" transform="rotate(240 -18 16)"/>
                <ellipse cx="-18" cy="-16" rx="10" ry="20" transform="rotate(300 -18 -16)"/>
              </g>
              <circle r="12" fill="#8A5A1E"/>
            </g>
          </g>

          <!-- yellow flower -->
          <g class="f2" transform="translate(224,165) scale(0.8)">
            <g class="petal-group">
              <g fill="#DCA219">
                <ellipse cx="0" cy="-24" rx="9" ry="18"/>
                <ellipse cx="17" cy="-14" rx="9" ry="18" transform="rotate(60 17 -14)"/>
                <ellipse cx="17" cy="14" rx="9" ry="18" transform="rotate(120 17 14)"/>
                <ellipse cx="0" cy="24" rx="9" ry="18" transform="rotate(180 0 24)"/>
                <ellipse cx="-17" cy="14" rx="9" ry="18" transform="rotate(240 -17 14)"/>
                <ellipse cx="-17" cy="-14" rx="9" ry="18" transform="rotate(300 -17 -14)"/>
              </g>
              <circle r="11" fill="#8A5A1E"/>
            </g>
          </g>

          <!-- small yellow bud -->
          <g class="f3" transform="translate(108,175) scale(0.65)">
            <g class="petal-group">
              <g fill="#F0C544">
                <ellipse cx="0" cy="-22" rx="8" ry="16"/>
                <ellipse cx="16" cy="-13" rx="8" ry="16" transform="rotate(60 16 -13)"/>
                <ellipse cx="16" cy="13" rx="8" ry="16" transform="rotate(120 16 13)"/>
                <ellipse cx="0" cy="22" rx="8" ry="16" transform="rotate(180 0 22)"/>
                <ellipse cx="-16" cy="13" rx="8" ry="16" transform="rotate(240 -16 13)"/>
                <ellipse cx="-16" cy="-13" rx="8" ry="16" transform="rotate(300 -16 -13)"/>
              </g>
              <circle r="10" fill="#96641F"/>
            </g>
          </g>

          <!-- small yellow bud -->
          <g class="f5" transform="translate(158,165) scale(0.55)">
            <g class="petal-group">
              <g fill="#F0D24A">
                <ellipse cx="0" cy="-22" rx="8" ry="16"/>
                <ellipse cx="16" cy="-13" rx="8" ry="16" transform="rotate(60 16 -13)"/>
                <ellipse cx="16" cy="13" rx="8" ry="16" transform="rotate(120 16 13)"/>
                <ellipse cx="0" cy="22" rx="8" ry="16" transform="rotate(180 0 22)"/>
                <ellipse cx="-16" cy="13" rx="8" ry="16" transform="rotate(240 -16 13)"/>
                <ellipse cx="-16" cy="-13" rx="8" ry="16" transform="rotate(300 -16 -13)"/>
              </g>
              <circle r="10" fill="#C4881A"/>
            </g>
          </g>

          <!-- small heart between flowers -->
          <g class="heart" transform="translate(170,95)">
            <path d="M0,10 C-14,-4 -14,-16 -4,-16 C0,-16 0,-12 0,-12 C0,-12 0,-16 4,-16 C14,-16 14,-4 0,10 Z" fill="#C96A78"/>
          </g>
        </svg>
      </div>

      <p class="message">
        La distancia no separe nuestro amor.<br>
        Aunque no estemos cerca, estás siempre presente.
      </p>

      <p class="signoff">Feliz primavera, Marisol 🌸</p>
    </div>
  </div>
  <footer>hecho especialmente para Marisol</footer>
</body>
</html>
